<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Armá tu 11 Mundial</title>

  <link rel="stylesheet" href="worldcup11.css" />
</head>

<body>
  <main class="game-page">

    <header class="topbar">
      <a href="../index.html" class="back">← Volver</a>

      <div class="brand">
        <strong>Partidos.Hoy</strong>
        <span>Armá tu 11</span>
      </div>

      <button class="help-btn" type="button" id="helpBtn">?</button>
    </header>

    <section class="game-header">
      <span class="daily-badge">Desafío diario</span>
      <h1>Armá tu 11 Mundial</h1>
      <p>Completá la formación del día con futbolistas del país indicado.</p>
    </section>

    <section class="tactical-board">

      <div class="pitch-frame">

        <div class="line line-attack">
          <button class="position-slot" data-position="ST">ST</button>
          <button class="position-slot" data-position="ST">ST</button>
        </div>

        <div class="line line-mid-advanced">
          <button class="position-slot" data-position="CAM">CAM</button>
        </div>

        <div class="line line-mid">
          <button class="position-slot" data-position="LM">LM</button>
          <button class="position-slot" data-position="CDM">CDM</button>
          <button class="position-slot" data-position="CDM">CDM</button>
          <button class="position-slot" data-position="RM">RM</button>
        </div>

        <div class="line line-defense">
          <button class="position-slot" data-position="CB">CB</button>
          <button class="position-slot" data-position="CB">CB</button>
          <button class="position-slot" data-position="CB">CB</button>
        </div>

        <div class="line line-gk">
          <button class="position-slot" data-position="GK">GK</button>
        </div>

      </div>

    </section>

    <section class="country-panel">
      <div class="country-indicator">
        <span class="country-flag" id="countryFlag">🇯🇵</span>
        <strong id="countryName">Japón</strong>
      </div>

      <form class="search-area" id="playerForm">
        <input
          type="search"
          id="playerSearch"
          placeholder="Ingresá nombre de futbolista..."
          autocomplete="off"
        />

        <button class="surrender-btn" type="button" id="surrenderBtn" title="Rendirse">
          🏳️
        </button>
      </form>

      <div class="suggestions" id="suggestions"></div>
    </section>

    <section class="status-panel">
      <div>
        <span>Formación</span>
        <strong id="formationText">3-5-2</strong>
      </div>

      <div>
        <span>Completados</span>
        <strong id="completedText">0/11</strong>
      </div>

      <div>
        <span>Puntaje</span>
        <strong id="scoreText">0</strong>
      </div>
    </section>

    <section class="result-modal hidden" id="resultModal">
      <div class="result-card">
        <h2 id="resultTitle">Resultado</h2>
        <p id="resultText"></p>

        <div class="result-actions">
          <button type="button" id="shareBtn">Compartir</button>
          <button type="button" id="restartBtn">Jugar de nuevo</button>
        </div>
      </div>
    </section>

  </main>

  <script src="worldcup11.js"></script>
</body>
</html>
