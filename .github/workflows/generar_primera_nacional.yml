name: Generar Primera Nacional ESPN

on:
  schedule:
    - cron: "40 8,14,20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar-primera-nacional:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Generar datos completos de Primera Nacional ESPN
        run: |
          python scripts/scraper_primera_nacional_full.py

      - name: Intentar generar fechas desde 365Scores
        run: |
          set +e
          python scripts/scraper_primera_nacional_365scores.py
          code=$?
          echo "SCRAPER_365_EXIT=$code" >> "$GITHUB_ENV"
          if [ "$code" -eq 0 ]; then
            echo "OK: 365Scores genero un calendario candidato"
          else
            echo "WARN: 365Scores no genero un calendario valido. Se usara fallback ESPN corregido."
          fi
          exit 0

      - name: Validar fechas 365Scores o usar fallback ESPN
        run: |
          if [ "${SCRAPER_365_EXIT}" = "0" ] && python scripts/validar_primera_nacional_fechas.py; then
            echo "OK: Fechas validas desde 365Scores"
          else
            echo "WARN: 365Scores no genero suficientes fechas. Usando fallback ESPN corregido."
            python scripts/generar_fechas_primera_nacional.py
            python scripts/reordenar_fechas_primera_nacional.py
            python scripts/asegurar_fixture_oficial_primera_nacional.py
            python scripts/corregir_fixture_oficial_primera_nacional.py
            python scripts/aplicar_fixture_oficial_primera_nacional.py
            python scripts/unir_partidos_mismo_dia_primera_nacional.py
            python scripts/validar_primera_nacional_fechas.py
          fi

      - name: Generar historial de campeones de Primera Nacional
        run: |
          python scripts/generar_campeones_primera_nacional.py

      - name: Aplicar reglas de tabla de Primera Nacional
        run: |
          python scripts/aplicar_reglas_primera_nacional.py

      - name: Postprocesar fechas (corregir horas UTC, ordenar, eliminar duplicados)
        run: |
          python scripts/postprocesar_primera_nacional_fechas.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/equipos_primera_nacional.json public/data/equipos_primera_nacional.json data/primera_nacional_fechas.json public/data/primera_nacional_fechas.json data/primera_nacional_fixture_oficial.json public/data/primera_nacional_fixture_oficial.json data/campeones_primera_nacional.json public/data/campeones_primera_nacional.json
          git commit -m "Actualizar Primera Nacional" || echo "Sin cambios"
          git push
