name: Generar Primera Nacional ESPN

on:
  schedule:
    - cron: "40 8,14,20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar-primera-nacional:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generar datos de Primera Nacional
        run: |
          python scripts/scraper_primera_nacional.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/equipos_primera_nacional.json public/data/equipos_primera_nacional.json
          git commit -m "Actualizar Primera Nacional" || echo "Sin cambios"
          git push
