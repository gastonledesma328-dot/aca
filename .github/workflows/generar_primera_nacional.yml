name: Generar Primera Nacional ESPN

on:
  schedule:
    - cron: "40 8,14,20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar-primera-nacional:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Generar datos completos de Primera Nacional
        run: |
          python scripts/scraper_primera_nacional_full.py

      - name: Generar fechas completas de Primera Nacional
        run: |
          python scripts/generar_fechas_primera_nacional.py

      - name: Reordenar fechas oficiales de Primera Nacional
        run: |
          python scripts/reordenar_fechas_primera_nacional.py

      - name: Crear fixture oficial fijo si falta
        run: |
          python scripts/asegurar_fixture_oficial_primera_nacional.py

      - name: Aplicar fixture oficial fijo a fechas
        run: |
          python scripts/aplicar_fixture_oficial_primera_nacional.py

      - name: Validar fechas de Primera Nacional
        run: |
          python scripts/validar_primera_nacional_fechas.py

      - name: Aplicar reglas de tabla de Primera Nacional
        run: |
          python scripts/aplicar_reglas_primera_nacional.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/equipos_primera_nacional.json public/data/equipos_primera_nacional.json data/primera_nacional_fechas.json public/data/primera_nacional_fechas.json data/primera_nacional_fixture_oficial.json public/data/primera_nacional_fixture_oficial.json
          git commit -m "Actualizar Primera Nacional" || echo "Sin cambios"
          git push
