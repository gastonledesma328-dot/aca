name: FUTBIN fotos Adivina Jugador

on:
  workflow_dispatch:
    inputs:
      max_players:
        description: "Cantidad máxima de jugadores a procesar, 0 = todos"
        required: false
        default: "0"
      start_from:
        description: "Posición inicial, útil para reanudar"
        required: false
        default: "1"
      delay_seconds:
        description: "Pausa entre jugadores"
        required: false
        default: "1.5"

permissions:
  contents: write

jobs:
  futbin-fotos:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests playwright
          python -m playwright install --with-deps chromium

      - name: Run FUTBIN scraper
        env:
          MAX_PLAYERS: ${{ github.event.inputs.max_players }}
          START_FROM: ${{ github.event.inputs.start_from }}
          DELAY_SECONDS: ${{ github.event.inputs.delay_seconds }}
          PAGE_TIMEOUT_MS: "25000"
          REQUEST_TIMEOUT: "25"
        run: |
          python scripts/futbin_fotos/descargar_futbin_todos.py --headless
          python scripts/futbin_fotos/aplicar_fotos_locales.py

      - name: Commit generated data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/adivina-jugador scripts/futbin_fotos/aliases_futbin.json scripts/futbin_fotos/ignorar_futbin.json
          git commit -m "Actualizar fotos FUTBIN Adivina Jugador" || echo "No changes"
          git push
