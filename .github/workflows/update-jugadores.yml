name: Update Jugadores Selecciones

on:
  schedule:
    - cron: "0 5 * * *"   # Todos los días a las 05:00 UTC (02:00 ARG)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-jugadores:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Ejecutar scraper jugadores ESPN
        run: node scripts/scraper_jugadores_selecciones.js
        timeout-minutes: 15
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update jugadores-selecciones.json [ESPN]"
          file_pattern: "data/jugadores-selecciones.json public/data/jugadores-selecciones.json"
