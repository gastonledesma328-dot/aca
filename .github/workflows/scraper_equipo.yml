name: Scraper Equipo

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
         pip install requests playwright
         python -m playwright install --with-deps chromium

      - name: Run scraper equipo
        run: python scripts/scraper_equipo.py

      - name: Commit cambios
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/equipos.json
          git diff --staged --quiet || git commit -m "Actualizar datos equipos"
          git push
