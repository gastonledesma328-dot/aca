name: Actualizar jugadores Adivina Jugador

on:
  workflow_dispatch:
  schedule:
    - cron: "20 9 * * *"

permissions:
  contents: write

jobs:
  scrape-jugadores:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_adivina_jugador.txt

      - name: Scrappear jugadores actuales
        run: |
          python scripts/scraper_adivina_jugador.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add adivinajugador/jugadores.json

          if git diff --cached --quiet; then
            echo "No hay cambios para guardar"
          else
            git commit -m "Actualizar jugadores adivina jugador"
            git push
          fi
