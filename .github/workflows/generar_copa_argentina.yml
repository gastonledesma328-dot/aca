name: Generar Copa Argentina

"on":
  schedule:
    - cron: "15 9,15,21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar-copa-argentina:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Scraper Copa Argentina ESPN
        run: |
          python scripts/scraper_copa_argentina.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/copa_argentina_bracket.json public/data/copa_argentina_bracket.json
          git commit -m "Actualizar Copa Argentina" || echo "Sin cambios"
          git push
