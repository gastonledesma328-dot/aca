name: Actualizar TV Partidos

on:
  schedule:
    # 10:00 UTC = 07:00 Argentina aprox.
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar-tv-partidos:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install requests beautifulsoup4

      - name: Generar JSON de TV desde Live Soccer TV
        env:
          LOOKAHEAD_DAYS: "2"
        run: |
          python scripts/scraper_tv_partidos.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/tv_partidos.json
          git commit -m "Actualizar TV de partidos desde Live Soccer TV" || echo "Sin cambios para guardar"
          git push
