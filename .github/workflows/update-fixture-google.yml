name: Update Fixture Mundial 2026 (Google)

on:
  schedule:
    # Cada hora de 14:00 a 02:00 UTC (11:00 a 23:00 ARG) durante el Mundial
    # 11 Jun – 19 Jul 2026
    - cron: "0 11-23 * * *"
    # También cada 30 min durante las horas pico de partido (16-01 UTC)
    - cron: "30 16,17,18,19,20,21,22,23,0,1 * * *"
  workflow_dispatch:   # trigger manual desde GitHub

permissions:
  contents: write

jobs:
  scrape-fixture:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependencias
        run: |
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Ejecutar scraper Google Fixture
        run: node scripts/scraper_fixture_google.js
        timeout-minutes: 5

      - name: Guardar cambios si hubo updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update fixture-mundial2026.json [Google]"
          file_pattern: "data/fixture-mundial2026.json public/data/fixture-mundial2026.json"
