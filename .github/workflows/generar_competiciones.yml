name: Generar competiciones ESPN

on:
  schedule:
    - cron: "25 8,14,20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar-competiciones:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generar títulos desde Wikipedia y competiciones
        run: |
          python scripts/generar_competiciones_lpf_fix.py

      - name: Quitar títulos fallback
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          title_files = [
              Path("data/titulos-liga-profesional.json"),
              Path("public/data/titulos-liga-profesional.json"),
          ]

          valid_titles = {}
          for path in title_files:
              if not path.exists():
                  continue
              data = json.loads(path.read_text(encoding="utf-8"))
              for slug, info in (data.get("clubes") or {}).items():
                  if (info.get("fuente") or "").lower() != "wikipedia":
                      info["titulos"] = None
                      info["sin_fallback"] = True
                  elif info.get("titulos") is not None:
                      valid_titles[slug] = int(info.get("titulos") or 0)
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding="utf-8")

          for path in [Path("data/competiciones.json"), Path("public/data/competiciones.json")]:
              if not path.exists():
                  continue
              data = json.loads(path.read_text(encoding="utf-8"))
              for comp in data.get("competiciones") or []:
                  if comp.get("id") != "liga-profesional":
                      continue
                  for team in comp.get("equipos") or []:
                      slug = team.get("slug") or ""
                      if slug in valid_titles:
                          total = valid_titles[slug]
                          team["titulos"] = {
                              "total": total,
                              "liga": total,
                              "fuente": "wikipedia",
                              "criterio": "Primer número del par títulos/subcampeonatos en Títulos oficiales. Ejemplo: (35/23) => 35."
                          }
                      else:
                          team.pop("titulos", None)
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding="utf-8")
          PY

      - name: Generar páginas HTML de competiciones
        run: |
          python scripts/generar_paginas_competiciones.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/competiciones.json public/data/competiciones.json data/titulos-liga-profesional.json public/data/titulos-liga-profesional.json public/competiciones/*.html
          git commit -m "Actualizar competiciones y títulos" || echo "Sin cambios"
          git push
