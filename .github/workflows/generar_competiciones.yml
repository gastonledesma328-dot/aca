name: Generar competiciones ESPN

on:
  schedule:
    - cron: "25 8,14,20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar-competiciones:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generar datos de competiciones desde ESPN
        run: |
          python scripts/generar_competiciones_lpf_fix.py

      - name: Generar páginas HTML de competiciones
        run: |
          python scripts/generar_paginas_competiciones.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/competiciones.json public/data/competiciones.json public/competiciones/*.html
          git commit -m "Actualizar competiciones ESPN" || echo "Sin cambios"
          git push
