name: Generar competiciones ESPN

on:
  schedule:
    - cron: "25 8,14,20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar-competiciones:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Generar competiciones
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/generar_competiciones_lpf_fix.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              'if __name__ == "__main__":\n    generar_titulos_wikipedia()\n    g.main()\n',
              'if __name__ == "__main__":\n    g.main()\n'
          )
          path.write_text(text, encoding="utf-8")
          PY
          python scripts/generar_competiciones_lpf_fix.py

      - name: Actualizar títulos de Liga Profesional
        run: |
          python scripts/actualizar_titulos_liga_profesional.py

      - name: Validar títulos de Liga Profesional
        run: |
          python - <<'PY'
          import json
          import re
          import unicodedata
          from pathlib import Path

          def normalizar(texto):
              texto = str(texto or "").lower().strip()
              texto = unicodedata.normalize("NFD", texto)
              texto = "".join(c for c in texto if unicodedata.category(c) != "Mn")
              texto = texto.replace("'", "").replace("’", "")
              texto = re.sub(r"[^a-z0-9]+", " ", texto)
              return re.sub(r"\s+", " ", texto).strip()

          def slug(texto):
              return normalizar(texto).replace(" ", "-")

          def titulos(equipo):
              valor = equipo.get("titulos_primera_division")
              if valor is None:
                  valor = (equipo.get("titulos") or {}).get("primera_division")
              if valor is None:
                  valor = (equipo.get("titulos") or {}).get("liga")
              if valor is None:
                  valor = (equipo.get("titulos") or {}).get("total")
              return int(valor or 0)

          path = Path("public/data/competiciones.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          comp = next((c for c in data.get("competiciones", []) if c.get("id") == "liga-profesional"), None)
          if not comp:
              raise SystemExit("No se encontró liga-profesional en competiciones.json")

          equipos = comp.get("equipos", [])
          print("Equipos LPF para validar:")
          for e in equipos:
              print("-", e.get("slug"), "|", e.get("id"), "|", e.get("nombre"), "|", titulos(e))

          def buscar(*posibles):
              claves = {slug(p) for p in posibles if p}
              for e in equipos:
                  valores = [e.get("slug"), e.get("id"), e.get("nombre"), e.get("nombre_corto")]
                  normalizados = {slug(v) for v in valores if v}
                  if claves & normalizados:
                      return e
              return None

          esperados = [
              (("river-plate", "River Plate"), 38),
              (("boca-juniors", "Boca Juniors"), 35),
              (("racing-club", "Racing Club", "Racing"), 18),
              (("rosario-central", "Rosario Central"), 5),
          ]

          errores = []
          for nombres, esperado in esperados:
              equipo = buscar(*nombres)
              detectado = titulos(equipo or {}) if equipo else None
              if detectado != esperado:
                  errores.append(f"{nombres[0]}: esperado {esperado}, detectado {detectado}")

          if errores:
              raise SystemExit("Títulos inválidos. No se publica JSON roto: " + " | ".join(errores))

          print("✅ Títulos validados correctamente")
          PY

      - name: Generar páginas HTML de competiciones
        run: |
          python scripts/generar_paginas_competiciones.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/competiciones.json public/data/competiciones.json data/titulos-liga-profesional.json public/data/titulos-liga-profesional.json public/competiciones/*.html
          git commit -m "Actualizar competiciones y títulos" || echo "Sin cambios"
          git push
