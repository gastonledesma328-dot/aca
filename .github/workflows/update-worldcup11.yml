name: Update WorldCup11 JSON

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: write

jobs:
  update-worldcup11:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Update WorldCup11 data from ESPN
        run: node scripts/update-worldcup11-espn.js

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update WorldCup11 players JSON"
          file_pattern: "data/worldcup11-players.json public/data/worldcup11-players.json"
