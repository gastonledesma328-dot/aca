name: Actualizar plantilla 365Scores Adivina Jugador

on:
  workflow_dispatch:
  schedule:
    - cron: "20 9 * * *"

permissions:
  contents: write

concurrency:
  group: actualizar-plantilla-365scores-adivina
  cancel-in-progress: false

jobs:
  actualizar-plantilla:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_365_plantilla.txt
          python -m playwright install --with-deps chromium

      - name: Scrappear plantilla 365Scores e imágenes
        run: |
          python scripts/scraper_365_plantilla.py

      - name: Sincronizar archivos públicos
        run: |
          mkdir -p public/juegos/adivinajugador/imagenes_jugadores_365
          mkdir -p public/data/adivina-jugador
          cp juegos/adivinajugador/jugadores.json public/juegos/adivinajugador/jugadores.json
          cp data/adivina-jugador/plantilla_365_jugadores.json public/data/adivina-jugador/plantilla_365_jugadores.json
          cp data/adivina-jugador/plantilla_365_jugadores_simple.json public/data/adivina-jugador/plantilla_365_jugadores_simple.json
          rsync -a --delete juegos/adivinajugador/imagenes_jugadores_365/ public/juegos/adivinajugador/imagenes_jugadores_365/

      - name: Guardar cambios
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/adivina-jugador/plantilla_365_jugadores.json
          git add data/adivina-jugador/plantilla_365_jugadores_simple.json
          git add juegos/adivinajugador/jugadores.json
          git add juegos/adivinajugador/imagenes_jugadores_365/
          git add public/juegos/adivinajugador/jugadores.json
          git add public/juegos/adivinajugador/imagenes_jugadores_365/
          git add public/data/adivina-jugador/plantilla_365_jugadores.json
          git add public/data/adivina-jugador/plantilla_365_jugadores_simple.json

          if git diff --cached --quiet; then
            echo "No hay cambios para guardar"
          else
            git commit -m "Actualizar plantilla 365Scores Adivina Jugador"
            git pull --rebase origin main
            git push origin main
          fi
