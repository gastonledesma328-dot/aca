<!DOCTYPE html>
<html lang="es" data-theme="futbol">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="../../img/logo.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Adivina el Jugador | Fut11</title>

  <style>
    /* Tema fútbol (default) */
    :root, [data-theme="futbol"] {
      --bg: #10251d; --bg2: #19382b; --sur: #0f2018; --sur2: #142819;
      --bdr: #1e3524; --bdr2: #284a30; --txt: #e2f0e7; --txt2: #6e9478; --txt3: #38583f;
      --acc: #3ecf6a; --acc-fg: #061209; --field: #1f7a3c; --field2: #166331;
      --card: #f5f5f0; --dark: #13251c; --text: #f0faf4; --muted: rgba(240,250,244,0.62);
      --primary: #5fcf80; --danger: #e8533a; --border: rgba(255,255,255,0.14);
      --shadow: 0 10px 30px rgba(0,0,0,0.38); --red: #e8533a; --yellow: #f5c518;
    }
    /* Tema oscuro */
    [data-theme="dark"] {
      --bg: #060606; --bg2: #111111; --sur: #0d0d0d; --sur2: #121212;
      --bdr: #1f1f1f; --bdr2: #2a2a2a; --txt: #e8e8e8; --txt2: #666666; --txt3: #3a3a3a;
      --acc: #e8e8e8; --acc-fg: #060606; --field: #1f7a3c; --field2: #166331;
      --card: #1f1f1f; --dark: #000000; --text: #e8e8e8; --muted: rgba(232,232,232,0.55);
      --primary: #e8e8e8; --danger: #e8533a; --border: rgba(255,255,255,0.1);
      --shadow: 0 10px 30px rgba(0,0,0,0.6); --red: #e8533a; --yellow: #f5c518;
    }
    /* Tema claro */
    [data-theme="light"] {
      --bg: #f0f0f0; --bg2: #e4e4e4; --sur: #ffffff; --sur2: #f7f7f7;
      --bdr: #e0e0e0; --bdr2: #cacaca; --txt: #0a0a0a; --txt2: #606060; --txt3: #b0b0b0;
      --acc: #0a0a0a; --acc-fg: #ffffff; --field: #1f7a3c; --field2: #166331;
      --card: #ffffff; --dark: #d0d0d0; --text: #0a0a0a; --muted: rgba(10,10,10,0.55);
      --primary: #0a7a3a; --danger: #cc3322; --border: rgba(0,0,0,0.12);
      --shadow: 0 10px 30px rgba(0,0,0,0.12); --red: #cc3322; --yellow: #b8860b;
    }

    .shell{width:min(calc(100% - 40px),1080px);margin:0 auto;padding-top:18px;}
    html{overflow-y:scroll;}
    .topbar{display:flex;align-items:center;justify-content:space-between;padding:0 22px;height:52px;background:var(--sur);border:1px solid var(--bdr);margin-bottom:16px;}
    .brand{font-size:20px;font-weight:800;font-style:italic;letter-spacing:-0.05em;line-height:1;display:flex;align-items:center;color:var(--txt);text-decoration:none;font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif;}
    .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--acc);margin:0 1px;vertical-align:middle;position:relative;top:5px;box-shadow:0 0 8px var(--acc);}
    .topbar-right{display:flex;align-items:center;gap:8px;}
    .themes{display:flex;border:1px solid var(--bdr);overflow:hidden;}
    .tbtn{width:34px;height:28px;display:grid;place-items:center;color:var(--txt3);background:var(--sur2);border:none;border-right:1px solid var(--bdr);transition:background .1s,color .1s;cursor:pointer;}
    .tbtn:last-child{border-right:none;}
    .tbtn:hover{background:var(--bdr2);color:var(--txt);}
    .tbtn.on{background:var(--acc);color:var(--acc-fg);}
    .tbtn svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
    .fsbtn{width:34px;height:28px;display:grid;place-items:center;color:var(--txt3);background:var(--sur2);border:1px solid var(--bdr);cursor:pointer;transition:background .1s,color .1s;flex-shrink:0;}
    .fsbtn:hover{background:var(--bdr2);color:var(--txt);}
    .fsbtn svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
    .fsbtn .icon-exit{display:none;}
    :fullscreen .fsbtn .icon-enter{display:none;}
    :fullscreen .fsbtn .icon-exit{display:block;}
    :fullscreen .fsbtn{background:var(--acc);color:var(--acc-fg);border-color:transparent;}
    :-webkit-full-screen .fsbtn .icon-enter{display:none;}
    :-webkit-full-screen .fsbtn .icon-exit{display:block;}
    :-webkit-full-screen .fsbtn{background:var(--acc);color:var(--acc-fg);border-color:transparent;}
    body{background:radial-gradient(circle at top,rgba(95,207,128,0.15),transparent 35%),linear-gradient(160deg,var(--bg),var(--bg2));}
    .game-page{width:100% !important;padding:0 !important;}
    .game-page > *{width:100% !important;max-width:100% !important;margin-left:0 !important;margin-right:0 !important;}
    .game-card{width:100% !important;max-width:100% !important;}
  </style>

  <link rel="stylesheet" href="./style.css" />
</head>

<body>

  <div class="shell">
    <header class="topbar">
      <a class="brand" href="../../index.html">Fut<span class="dot"></span>11</a>
      <div class="topbar-right">
        <button class="fsbtn" id="fsBtn" type="button" title="Pantalla completa" aria-label="Pantalla completa">
          <svg class="icon-enter" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
          <svg class="icon-exit" viewBox="0 0 24 24"><path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/></svg>
        </button>
        <div class="themes" role="group" aria-label="Tema">
          <button class="tbtn" data-t="light" title="Claro">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          </button>
          <button class="tbtn" data-t="dark" title="Oscuro">
            <svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>
          <button class="tbtn on" data-t="futbol" title="Fútbol">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2"/></svg>
          </button>
        </div>
      </div>
    </header>

    <main class="game-page">

  <section class="game-header-section">
    <span class="limit-pill">Sin límite diario</span>
    <h1>Adivina el jugador</h1>
    <p class="hero-text">Descubrí al futbolista oculto usando pistas de país, club, liga, posición, edad y altura.</p>

    <div class="difficulty-grid" aria-label="Elegir dificultad">
      <button class="difficulty-card active" type="button" data-difficulty="facil">
        <strong>Fácil</strong>
        <span>Lista de jugadores + 8 intentos</span>
      </button>
      <button class="difficulty-card" type="button" data-difficulty="normal">
        <strong>Normal</strong>
        <span>Sin lista + 8 intentos</span>
      </button>
      <button class="difficulty-card" type="button" data-difficulty="dificil">
        <strong>Difícil</strong>
        <span>Sin lista + 5 intentos</span>
      </button>
    </div>
  </section>

  <section class="game-card" id="gameCard">
    <div class="mode-panel">
      <div class="pistas-block">
        <span class="panel-label">Pistas activas</span>
        <div class="button-group categories" aria-label="Elegir pistas activas">
          <button class="chip-btn active" type="button" data-category="pais">País</button>
          <button class="chip-btn active" type="button" data-category="club">Club</button>
          <button class="chip-btn active" type="button" data-category="competicion">Liga</button>
          <button class="chip-btn active" type="button" data-category="posicion">Posición</button>
          <button class="chip-btn active" type="button" data-category="edad">Edad</button>
          <button class="chip-btn active" type="button" data-category="altura">Altura</button>
          <button class="chip-btn ghost" id="allCategoriesBtn" type="button">Todas</button>
        </div>
      </div>

      <div class="hints-row">
        <div class="hint-card">
          <span>Liga del oculto</span>
          <strong id="secretCompetition">?</strong>
        </div>
        <div class="hint-card">
          <span>Intentos usados</span>
          <strong id="triesUsed">0/8</strong>
        </div>
      </div>
    </div>

    <div class="toolbar">
      <label class="field search-field">
        <span>Jugador</span>
        <input id="playerInput" type="text" placeholder="Ej: Messi, Mbappé, Neymar..." autocomplete="off" list="playersList" />
        <datalist id="playersList"></datalist>
      </label>
      <button id="guessBtn" class="primary-btn" type="button">Probar</button>
      <button id="newGameBtn" class="secondary-btn" type="button">Nuevo</button>
    </div>

    <div id="message" class="message"></div>

    <div class="table-wrap">
      <table class="guess-table">
        <thead id="tableHead"></thead>
        <tbody id="guessesBody"></tbody>
      </table>
    </div>
  </section>

  <div id="resultModal" class="result-modal hidden" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
    <div class="result-splash">
      <div class="result-icon" id="resultIcon">🏆</div>
      <p class="result-kicker" id="resultKicker">Juego completado</p>
      <h2 id="resultTitle">¡Felicitaciones!</h2>
      <p id="resultText" class="result-text"></p>
      <div id="resultMeta" class="result-meta"></div>
      <div class="result-actions">
        <button id="resultNewGameBtn" class="primary-result-btn" type="button">Nuevo juego</button>
        <button id="resultCloseBtn" class="secondary-result-btn" type="button">Ver tablero</button>
      </div>
    </div>
  </div>

</main>
  </div>

  <script>
    (function(){
      const html = document.documentElement;
      const THEME_KEY = 'ph-theme';

      /* Lee el tema guardado; si no hay ninguno, usa 'futbol' como default
         (NO guarda automáticamente para no pisar una elección futura del usuario) */
      function getSaved(){
        return localStorage.getItem(THEME_KEY) || 'futbol';
      }

      function syncButtons(t){
        document.querySelectorAll('.tbtn').forEach(b => b.classList.toggle('on', b.dataset.t === t));
      }

      function applyTheme(t, save){
        html.setAttribute('data-theme', t);
        if(save) localStorage.setItem(THEME_KEY, t);
        syncButtons(t);
      }

      /* Aplica al cargar sin guardar (solo refleja lo que ya había) */
      applyTheme(getSaved(), false);

      /* Al hacer click el usuario elige explícitamente → guardar */
      document.querySelectorAll('.tbtn').forEach(b =>
        b.addEventListener('click', () => applyTheme(b.dataset.t, true))
      );

      /* Pantalla completa */
      const fsBtn = document.getElementById('fsBtn');
      if (fsBtn) {
        fsBtn.addEventListener('click', () => {
          if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(() => {});
          } else {
            document.exitFullscreen().catch(() => {});
          }
        });
      }
    })();
  </script>
  <script src="./app.js"></script>

</body>
</html>
