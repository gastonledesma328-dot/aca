<!DOCTYPE html>
<html lang="es" data-theme="futbol">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="../../img/logo.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Armá tu 11 de Leyendas | Partidos.Hoy</title>

  <style>
    :root,[data-theme="futbol"]{--bg:#0b1a13;--sur:#0f2018;--sur2:#142819;--bdr:#1e3524;--bdr2:#284a30;--acc:#3ecf6a;--acc-fg:#061209;--txt:#e2f0e7;--txt2:#6e9478;--txt3:#38583f;}
    [data-theme="dark"]{--bg:#060606;--sur:#0d0d0d;--sur2:#121212;--bdr:#1f1f1f;--bdr2:#2a2a2a;--acc:#e8e8e8;--acc-fg:#060606;--txt:#e8e8e8;--txt2:#666;--txt3:#3a3a3a;}
    [data-theme="light"]{--bg:#f0f0f0;--sur:#ffffff;--sur2:#f7f7f7;--bdr:#e0e0e0;--bdr2:#cacaca;--acc:#0a0a0a;--acc-fg:#ffffff;--txt:#0a0a0a;--txt2:#606060;--txt3:#b0b0b0;}

    .shell{width:min(100% - 2.5rem,1080px);margin:0 auto;padding-top:18px;}
    .topbar{display:flex;align-items:center;justify-content:space-between;padding:0 22px;height:52px;background:var(--sur);border:1px solid var(--bdr);margin-bottom:16px;}
    .brand{font-size:20px;font-weight:800;font-style:italic;letter-spacing:-0.05em;line-height:1;display:flex;align-items:center;color:var(--txt);text-decoration:none;font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif;}
    .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--acc);margin:0 1px;vertical-align:middle;position:relative;top:5px;box-shadow:0 0 8px var(--acc);}
    .themes{display:flex;border:1px solid var(--bdr);overflow:hidden;}
    .tbtn{width:34px;height:28px;display:grid;place-items:center;color:var(--txt3);background:var(--sur2);border:none;border-right:1px solid var(--bdr);transition:background .1s,color .1s;cursor:pointer;}
    .tbtn:last-child{border-right:none;}
    .tbtn:hover{background:var(--bdr2);color:var(--txt);}
    .tbtn.on{background:var(--acc);color:var(--acc-fg);}
    .tbtn svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
    .topbar-right{display:flex;align-items:center;gap:8px;}
    .fsbtn{width:34px;height:28px;display:grid;place-items:center;color:var(--txt3);background:var(--sur2);border:1px solid var(--bdr);cursor:pointer;transition:background .1s,color .1s;flex-shrink:0;}
    .fsbtn:hover{background:var(--bdr2);color:var(--txt);}
    .fsbtn svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
    .fsbtn .icon-exit{display:none;}
    :fullscreen .fsbtn .icon-enter{display:none;}
    :fullscreen .fsbtn .icon-exit{display:block;}
    :fullscreen .fsbtn{background:var(--acc);color:var(--acc-fg);border-color:transparent;}
    :-webkit-full-screen .fsbtn .icon-enter{display:none;}
    :-webkit-full-screen .fsbtn .icon-exit{display:block;}
    :-webkit-full-screen .fsbtn{background:var(--acc);color:var(--acc-fg);border-color:transparent;}
  </style>

  <link rel="stylesheet" href="legends11.css" />
</head>

<body>

  <div class="shell">
    <header class="topbar">
      <a class="brand" href="../../index.html">Fut<span class="dot"></span>11</a>
      <div class="topbar-right">
        <button class="fsbtn" id="fsBtn" type="button" title="Pantalla completa" aria-label="Pantalla completa">
          <svg class="icon-enter" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
          <svg class="icon-exit" viewBox="0 0 24 24"><path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/></svg>
        </button>
        <div class="themes" role="group" aria-label="Tema">
          <button class="tbtn" data-t="light" title="Claro">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          </button>
          <button class="tbtn" data-t="dark" title="Oscuro">
            <svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>
          <button class="tbtn on" data-t="futbol" title="Fútbol">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2"/></svg>
          </button>
        </div>
      </div>
    </header>
  </div>

  <main class="game-page">

    <section class="game-header">
      <h1>Armá tu 11 de Leyendas</h1>
      <p>Adivina el jugador con la casilla predilecta completando con una leyenda válida del país indicado.</p>
    </section>

    <section class="mode-card" aria-label="Modos de juego">
      <button class="mode-btn active" type="button" data-mode="easy">
        <strong>Fácil</strong>
        <span>Populares · Con pista</span>
      </button>
      <button class="mode-btn" type="button" data-mode="normal">
        <strong>Normal</strong>
        <span>Populares · Sin ayudas</span>
      </button>
      <button class="mode-btn" type="button" data-mode="hard">
        <strong>Difícil</strong>
        <span>Menos conocidos · Sin ayudas · 90 seg</span>
      </button>
      <button class="mode-btn" type="button" data-mode="impossible">
        <strong>Imposible</strong>
        <span>Todos los jugadores · Sin ayudas · 60 seg</span>
      </button>
    </section>

    <section class="pitch-card" aria-label="Cancha">
      <div class="pitch-lines"></div>
      <div class="pitch-frame"></div>
    </section>

    <section class="country-panel">
      <!-- Barra de tiempo — visible solo en modos con límite -->
      <div id="timerBar" class="timer-bar hidden" aria-label="Tiempo restante">
        <svg class="timer-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
        </svg>
        <span id="timerText" class="timer-text">1:30</span>
        <div class="timer-track"><div id="timerFill" class="timer-fill"></div></div>
      </div>

      <div class="country-current-card">
        <img
          id="countryFlag"
          class="country-flag-img"
          src="https://flagcdn.com/w40/un.png"
          alt="Bandera"
        />
        <div class="country-current-info">
          <strong id="countryName">Cargando...</strong>
          <span id="positionName">Buscá una leyenda para esta posición.</span>
        </div>
      </div>

      <form id="playerForm" class="search-area">
        <input
          id="playerSearch"
          type="text"
          autocomplete="off"
          placeholder="Escribí una leyenda..."
        />
        <button
          id="surrenderBtn"
          class="surrender-btn"
          type="button"
          title="Rendirse"
          aria-label="Rendirse"
        >⚑</button>
      </form>

      <div id="suggestions" class="suggestions"></div>
      <p id="modeHint" class="mode-hint"></p>
    </section>

    <!-- status oculto: elementos necesarios para el JS pero no visibles -->
    <div style="display:none">
      <strong id="modeText"></strong>
      <strong id="completedText"></strong>
      <strong id="scoreText"></strong>
    </div>

    <section id="resultModal" class="result-modal hidden" aria-live="polite">
      <div class="result-box">
        <h2 id="resultTitle">Resultado</h2>
        <p id="resultText"></p>
        <div class="result-actions">
          <button id="shareBtn" type="button">Compartir</button>
          <a id="backToGamesBtn" class="hidden" href="../../index.html#games">Volver a juegos</a>
        </div>
      </div>
    </section>

    <section id="modeChangeModal" class="result-modal hidden" aria-live="polite">
      <div class="result-box">
        <h2>Cambiar modo</h2>
        <p>Si cambiás de modo se reinicia el desafío actual.</p>
        <div class="result-actions">
          <button id="confirmModeChangeBtn" type="button">Cambiar</button>
          <button id="cancelModeChangeBtn" type="button" class="secondary-btn">Cancelar</button>
        </div>
      </div>
    </section>

  </main>

  <script>
    (function(){
      const THEME_KEY = 'ph-theme';
      const root = document.documentElement;

      function apply(t){
        root.setAttribute('data-theme', t);
        localStorage.setItem(THEME_KEY, t);
        document.querySelectorAll('.tbtn').forEach(b =>
          b.classList.toggle('on', b.dataset.t === t)
        );
      }

      /* Aplicar guardado (o futbol por defecto) sin guardar */
      const saved = localStorage.getItem(THEME_KEY) || 'futbol';
      root.setAttribute('data-theme', saved);

      /* El script está al final del body — el DOM ya existe, no hace falta DOMContentLoaded */
      document.querySelectorAll('.tbtn').forEach(b =>
        b.addEventListener('click', () => apply(b.dataset.t))
      );

      /* Sincronizar botón activo */
      document.querySelectorAll('.tbtn').forEach(b =>
        b.classList.toggle('on', b.dataset.t === saved)
      );

      /* Pantalla completa */
      const fsBtn = document.getElementById('fsBtn');
      if (fsBtn) {
        fsBtn.addEventListener('click', () => {
          if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(() => {});
          } else {
            document.exitFullscreen().catch(() => {});
          }
        });
      }
    })();
  </script>
  <script src="legends11.js"></script>
</body>
</html>
